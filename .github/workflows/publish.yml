name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag at the current master commit
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'dutchbsd/makepf' && github.event.repository.private == false && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify release tag and passing CI
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import runpy
          import subprocess
          import urllib.parse
          import urllib.request

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Expected a release tag such as v1.0.0')
          def revision(ref):
              return subprocess.check_output(['git', 'rev-parse', '--verify', ref], text=True).strip()
          head = revision('HEAD')
          if head != os.environ['GITHUB_SHA']:
              raise SystemExit('Checkout does not match this workflow run')
          if revision(f'refs/tags/{tag}^{{commit}}') != head or revision('refs/remotes/origin/master') != head:
              raise SystemExit('The release tag and master must identify this commit')
          version = runpy.run_path('makepf/__init__.py')['__version__']
          if tag != f'v{version}':
              raise SystemExit('The release tag does not match the package version')
          query = urllib.parse.urlencode({'branch': 'master', 'event': 'push', 'head_sha': head, 'per_page': 1})
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/test.yml/runs?{query}"
          request = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response)['workflow_runs']
          if not runs or runs[0]['head_sha'] != head or runs[0]['status'] != 'completed' or runs[0]['conclusion'] != 'success':
              raise SystemExit('The latest Tests run for this master commit must pass before publishing')
          PY
      - name: Create isolated Python environment
        run: |
          python -m venv --clear "$RUNNER_TEMP/makepf-release"
          echo "$RUNNER_TEMP/makepf-release/bin" >> "$GITHUB_PATH"
          echo "PIP_REQUIRE_VIRTUALENV=true" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - run: python -m pip install --no-deps dist/*.whl
      - name: Check installed command
        working-directory: ${{ runner.temp }}
        run: |
          makepf --version
          makepf check "${{ github.workspace }}/examples/dual-stack"
          makepf compile "${{ github.workspace }}/examples/dual-stack" -o makepf.pf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/makepf/
    permissions:
      id-token: write
    steps:
      - name: Prepare distribution directory
        id: distributions
        run: |
          directory="pypi-dist-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$directory"
          echo "path=$directory" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-distributions
          path: ${{ steps.distributions.outputs.path }}/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: ${{ steps.distributions.outputs.path }}/
