name: Tests

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'dutchbsd/makepf' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Create isolated Python environment
        run: |
          python -m venv --clear "$RUNNER_TEMP/makepf-test-${{ matrix.python }}"
          echo "$RUNNER_TEMP/makepf-test-${{ matrix.python }}/bin" >> "$GITHUB_PATH"
          echo "PIP_REQUIRE_VIRTUALENV=true" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -v
      - run: python tools/build.py
      - run: python dist/makepf --version
      - run: python dist/makepf check examples/handbook
      - run: python dist/makepf check examples/faq
      - run: python dist/makepf check examples/dual-stack

  package:
    if: github.repository == 'dutchbsd/makepf' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Create isolated Python environment
        run: |
          python -m venv --clear "$RUNNER_TEMP/makepf-package"
          echo "$RUNNER_TEMP/makepf-package/bin" >> "$GITHUB_PATH"
          echo "PIP_REQUIRE_VIRTUALENV=true" >> "$GITHUB_ENV"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - run: python -m pip install --no-deps dist/*.whl
      - name: Check installed command outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          makepf --version
          makepf check "${{ github.workspace }}/examples/dual-stack"
          makepf compile "${{ github.workspace }}/examples/dual-stack" -o makepf.pf
